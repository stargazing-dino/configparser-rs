[package]
name = "configparser"
version = "3.3.0"
authors = ["QEDK <hi@qedk.xyz>"]
edition = "2024"
rust-version = "1.85"
description = "A simple configuration parsing utility with no dependencies that allows you to parse INI and ini-style syntax. You can use this to write Rust programs which can be customized by end users easily."
homepage = "https://github.com/QEDK/configparser-rs"
repository = "https://github.com/QEDK/configparser-rs"
documentation = "https://docs.rs/configparser"
readme = "README.md"
license = "MIT OR LGPL-3.0-or-later"
keywords = ["config", "ini", "settings", "configuration", "parser"]
categories = ["config", "encoding", "parser-implementations"]

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
indexmap = { version = "^2.14", optional = true, default-features = false }
tokio = { version = "^1.53", optional = true, features = ["fs"] }
serde = { version = "^1.0", optional = true, default-features = false }

[features]
default = ["std"]
std = ["serde?/std"]
# indexmap without `std` has no default hasher, so the feature implies `std`.
indexmap = ["dep:indexmap", "std", "indexmap/std"]
serde = ["dep:serde", "serde/alloc", "indexmap?/serde"]
tokio = ["dep:tokio", "std"]

[dev-dependencies]
tokio = { version = "^1.53", features = ["fs", "macros", "rt-multi-thread"] }
serde_json = { version = "^1.0" }
